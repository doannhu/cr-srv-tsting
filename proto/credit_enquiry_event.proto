syntax = "proto3";

package proto;

import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

option go_package = "go-loan-service-v3/proto";

// CreditEnquiryEvent represents a CloudEvent for credit enquiry creation
message CreditEnquiryEvent {
  // CloudEvent attributes
  string id = 1 [(validate.rules).string = {min_len: 1}];                // ce-id
  string source = 2 [(validate.rules).string = {min_len: 1}];            // ce-source
  string spec_version = 3 [(validate.rules).string = {min_len: 1}];      // ce-specversion
  string type = 4 [(validate.rules).string = {min_len: 1}];              // ce-type
  string data_content_type = 5 [(validate.rules).string = {min_len: 1}]; // ce-datacontenttype
  string data_schema = 6 [(validate.rules).string = {min_len: 1}];       // ce-dataschema
  string subject = 7 [(validate.rules).string = {min_len: 1}];           // ce-subject
  google.protobuf.Timestamp time = 8; // ce-time

  // Event data
  CreditEnquiryEventData data = 9 [(validate.rules).message.required = true];
}

// CreditEnquiryEventData contains the actual event payload
message CreditEnquiryEventData {
  string credit_enquiry_id = 1 [(validate.rules).string = {min_len: 1}];
  string application_number = 2 [(validate.rules).string = {min_len: 1}];
  string enquiry_state = 3 [(validate.rules).string = {min_len: 1}];
  double loan_amount = 4 [(validate.rules).double = {gte: 0}];
  string loan_purpose = 5 [(validate.rules).string = {min_len: 1}];
  int64 initial_structure_term_month = 6 [(validate.rules).int64 = {gte: 0}];
  double total_monthly_net_income_amount = 7 [(validate.rules).double = {gte: 0}];
  double total_annual_gross_income = 8 [(validate.rules).double = {gte: 0}];
  double total_savings_amount = 9 [(validate.rules).double = {gte: 0}];
  int64 total_number_of_continuing_home_loans = 10 [(validate.rules).int64 = {gte: 0}];
} 