version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "50051:50051"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SERVER_PORT=50051
      - SPANNER_PROJECT=${SPANNER_PROJECT}
      - SPANNER_INSTANCE=${SPANNER_INSTANCE}
      - SPANNER_DATABASE=${SPANNER_DATABASE}
      - PUBSUB_PROJECT=${PUBSUB_PROJECT}
      - PUBSUB_TOPIC=${PUBSUB_TOPIC}
    volumes:
      - ./key.json:/app/key.json:ro
    depends_on:
      - redis
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  redis_data: 